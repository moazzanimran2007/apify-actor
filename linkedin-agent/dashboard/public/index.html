<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prdikt LinkedIn Agent</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b23;
    --panel-2: #1c232e;
    --border: #2a3341;
    --text: #e6ebf2;
    --muted: #8b98ab;
    --accent: #4f8ff7;
    --green: #3ecf8e;
    --amber: #f2b64c;
    --red: #f07178;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 32px 20px 64px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .mode-pill {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); background: var(--panel);
  }
  .mode-pill.apify { color: var(--green); border-color: rgba(62,207,142,.35); }
  .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 28px; }

  section { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 14px; }

  .providers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 640px) { .providers { grid-template-columns: 1fr; } }
  .provider-card {
    background: var(--panel-2); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 14px; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .provider-card:hover { border-color: #3a4657; }
  .provider-card.selected { border-color: var(--accent); background: rgba(79,143,247,.08); }
  .provider-card .p-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .provider-card .p-dot { width: 9px; height: 9px; border-radius: 50%; }
  .provider-card .p-family { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .provider-card .p-check { float: right; color: var(--accent); font-size: 14px; visibility: hidden; }
  .provider-card.selected .p-check { visibility: visible; }

  .row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; }
  .field { flex: 1; min-width: 200px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  select, input[type="text"], input[type="number"] {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 14px;
  }
  select:focus, input:focus { outline: none; border-color: var(--accent); }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .toggle-label { font-size: 14.5px; font-weight: 550; }
  .toggle-desc { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: var(--border); border-radius: 999px;
    cursor: pointer; transition: background .15s;
  }
  .slider::before {
    content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; top: 3px; left: 3px; transition: transform .15s;
  }
  .switch input:checked + .slider { background: var(--amber); }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 8px;
    border: 1px solid transparent; cursor: pointer; transition: filter .15s;
  }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  #statusMsg { font-size: 13px; color: var(--muted); }
  #statusMsg.ok { color: var(--green); }
  #statusMsg.err { color: var(--red); }
  #statusMsg a { color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .badge.published { background: rgba(62,207,142,.14); color: var(--green); }
  .badge.draft { background: rgba(242,182,76,.14); color: var(--amber); }
  .badge.failed { background: rgba(240,113,120,.14); color: var(--red); }
  .empty { color: var(--muted); font-size: 13.5px; padding: 8px 2px; }
  .hook-cell { color: var(--muted); max-width: 320px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Prdikt <span>LinkedIn Agent</span></h1>
    <span class="mode-pill" id="modePill">connecting…</span>
  </header>
  <p class="sub">Choose which AI writes the posts. Saved settings apply to every scheduled run.</p>

  <section>
    <h2>Model provider</h2>
    <div class="providers" id="providerCards"></div>
    <div class="row">
      <div class="field">
        <label for="modelSelect">Model</label>
        <select id="modelSelect"></select>
      </div>
      <div class="field" id="customModelField" style="display:none">
        <label for="customModel">Custom model ID</label>
        <input type="text" id="customModel" placeholder="e.g. claude-sonnet-5">
      </div>
    </div>
  </section>

  <section>
    <h2>Publishing</h2>
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Review mode</div>
        <div class="toggle-desc">On: the agent writes a draft but does not post to LinkedIn. Off: posts go live.</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="reviewMode" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <div class="field">
        <label for="maxWebSearches">Max web searches / run</label>
        <input type="number" id="maxWebSearches" min="1" max="20" value="8">
      </div>
      <div class="field">
        <label for="maxWebFetches">Max web fetches / run</label>
        <input type="number" id="maxWebFetches" min="1" max="20" value="6">
      </div>
    </div>
  </section>

  <section>
    <div class="actions">
      <button class="btn-primary" id="saveBtn">Save settings</button>
      <button class="btn-secondary" id="runBtn">Run now</button>
      <span id="statusMsg"></span>
    </div>
  </section>

  <section>
    <h2>Recent posts</h2>
    <div id="historyWrap"><div class="empty">Loading…</div></div>
  </section>
</div>

<script>
const PROVIDERS = {
  anthropic: {
    name: 'Anthropic', family: 'Claude', color: '#d97757',
    models: ['claude-opus-4-8', 'claude-sonnet-5', 'claude-fable-5', 'claude-haiku-4-5'],
  },
  openai: {
    name: 'OpenAI', family: 'GPT', color: '#3ecf8e',
    models: ['gpt-5', 'gpt-5-mini', 'gpt-4.1'],
  },
  gemini: {
    name: 'Google', family: 'Gemini', color: '#4f8ff7',
    models: ['gemini-2.5-pro', 'gemini-2.5-flash'],
  },
};
const CUSTOM = '__custom__';

let state = { provider: 'anthropic', model: '', reviewMode: true, maxWebSearches: 8, maxWebFetches: 6 };
let appStatus = { mode: 'local', runEnabled: false };

const $ = (id) => document.getElementById(id);

function renderProviderCards() {
  $('providerCards').innerHTML = Object.entries(PROVIDERS).map(([key, p]) => `
    <div class="provider-card ${state.provider === key ? 'selected' : ''}" data-provider="${key}">
      <span class="p-check">✓</span>
      <div class="p-name"><span class="p-dot" style="background:${p.color}"></span>${p.name}</div>
      <div class="p-family">${p.family} · default ${p.models[0]}</div>
    </div>
  `).join('');
  document.querySelectorAll('.provider-card').forEach((card) => {
    card.addEventListener('click', () => {
      state.provider = card.dataset.provider;
      state.model = '';
      renderProviderCards();
      renderModelSelect();
    });
  });
}

function renderModelSelect() {
  const models = PROVIDERS[state.provider].models;
  const isKnown = !state.model || models.includes(state.model);
  $('modelSelect').innerHTML = [
    ...models.map((m, i) => `<option value="${m}">${m}${i === 0 ? ' (default)' : ''}</option>`),
    `<option value="${CUSTOM}">Custom…</option>`,
  ].join('');
  if (isKnown) {
    $('modelSelect').value = state.model || models[0];
    $('customModelField').style.display = 'none';
  } else {
    $('modelSelect').value = CUSTOM;
    $('customModelField').style.display = '';
    $('customModel').value = state.model;
  }
}

$('modelSelect') && document.addEventListener('change', (e) => {
  if (e.target.id === 'modelSelect') {
    $('customModelField').style.display = e.target.value === CUSTOM ? '' : 'none';
  }
});

function currentModel() {
  const sel = $('modelSelect').value;
  return sel === CUSTOM ? $('customModel').value.trim() : sel;
}

function setStatus(msg, cls = '') {
  $('statusMsg').innerHTML = msg;
  $('statusMsg').className = cls;
}

async function load() {
  const [status, config] = await Promise.all([
    fetch('/api/status').then((r) => r.json()),
    fetch('/api/config').then((r) => r.json()),
  ]);
  appStatus = status;
  state = { ...state, ...config };

  const pill = $('modePill');
  if (status.mode === 'apify') {
    pill.textContent = 'Apify connected';
    pill.classList.add('apify');
  } else {
    pill.textContent = 'Local mode (no APIFY_TOKEN)';
  }
  $('runBtn').disabled = !status.runEnabled;
  if (!status.runEnabled) $('runBtn').title = 'Set APIFY_TOKEN and APIFY_ACTOR_ID to trigger runs from here';

  $('reviewMode').checked = state.reviewMode !== false;
  $('maxWebSearches').value = state.maxWebSearches ?? 8;
  $('maxWebFetches').value = state.maxWebFetches ?? 6;
  renderProviderCards();
  renderModelSelect();
  loadHistory();
}

async function loadHistory() {
  try {
    const history = await fetch('/api/history').then((r) => r.json());
    if (!Array.isArray(history) || history.length === 0) {
      $('historyWrap').innerHTML = `<div class="empty">${appStatus.mode === 'apify' ? 'No posts yet.' : 'History appears here once connected to Apify.'}</div>`;
      return;
    }
    $('historyWrap').innerHTML = `
      <table>
        <thead><tr><th>Date</th><th>Model</th><th>Format</th><th>Hook</th><th>Status</th></tr></thead>
        <tbody>
          ${history.map((h) => `
            <tr>
              <td>${(h.date || '').slice(0, 10)}</td>
              <td>${h.model || h.provider || '—'}</td>
              <td>${h.format || '—'}</td>
              <td class="hook-cell">${escapeHtml(h.hook || '')}</td>
              <td><span class="badge ${h.status || 'draft'}">${h.status || 'draft'}</span></td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch {
    $('historyWrap').innerHTML = '<div class="empty">Could not load history.</div>';
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

$('saveBtn').addEventListener('click', async () => {
  setStatus('Saving…');
  const body = {
    provider: state.provider,
    model: currentModel(),
    reviewMode: $('reviewMode').checked,
    maxWebSearches: $('maxWebSearches').value,
    maxWebFetches: $('maxWebFetches').value,
  };
  const res = await fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (res.ok) {
    state = { ...state, ...(await res.json()) };
    const target = appStatus.mode === 'apify' ? 'Apify config store' : 'local-config.json';
    setStatus(`Saved to ${target} — scheduled runs will use ${state.provider} / ${state.model || PROVIDERS[state.provider].models[0]}.`, 'ok');
  } else {
    const err = await res.json().catch(() => ({}));
    setStatus(`Save failed: ${err.error || res.status}`, 'err');
  }
});

$('runBtn').addEventListener('click', async () => {
  setStatus('Starting run…');
  const res = await fetch('/api/run', { method: 'POST' });
  const data = await res.json().catch(() => ({}));
  if (res.ok) {
    setStatus(`Run started — <a href="${data.url}" target="_blank" rel="noopener">watch it in the Apify console ↗</a>`, 'ok');
  } else {
    setStatus(`Run failed: ${data.error || res.status}`, 'err');
  }
});

load();
</script>
</body>
</html>
